<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Test</title>
<style>
  :root { --paper:#efe6d3; --ink:#2b2622; --night:#0d1019; --lantern:#f2b84b; --blood:#a3231b; }
  body { margin:0; padding:16px; font:15px/1.4 system-ui, sans-serif; background:var(--paper); color:var(--ink); }
  h1 { margin:0 0 8px; font-size:22px; }
  h2 { margin:18px 0 6px; font-size:16px; border-bottom:1px solid #0002; }
  button { font:inherit; padding:5px 10px; margin:2px; border:1.5px solid var(--ink); border-radius:6px 9px 7px 10px; background:#fff8; cursor:pointer; }
  button:hover { background:var(--lantern); }
  button.on { background:var(--lantern); }
  button.danger { border-color:var(--blood); color:var(--blood); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  label { margin-right:10px; }
  input[type=range] { vertical-align:middle; width:110px; }
  input[type=text] { font:inherit; padding:4px; width:320px; max-width:100%; }
  #log { background:var(--night); color:#cfd6e6; padding:8px; border-radius:6px; height:130px; overflow:auto; font:13px/1.35 ui-monospace, monospace; white-space:pre-wrap; }
  #result { background:#fff8; padding:8px; border-radius:6px; font:12px/1.3 ui-monospace, monospace; white-space:pre; overflow:auto; max-height:420px; }
</style>
</head>
<body>
<h1>Same Shape - audio test bench</h1>
<div class="row">
  <button id="init">init()</button>
  <button id="stop" class="danger">stopAll()</button>
  <button id="selftest">Run self-test</button>
  <span id="state">audio.ready = false</span>
</div>
<div class="row">
  <label>master <input id="vm" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  <label>music <input id="vmu" type="range" min="0" max="1" step="0.01" value="0.6"></label>
  <label>sfx <input id="vs" type="range" min="0" max="1" step="0.01" value="0.9"></label>
  <label><input id="reduce" type="checkbox"> reduce scares</label>
</div>

<h2>Music</h2><div class="row" id="music"></div>
<h2>Ambience</h2><div class="row" id="ambient"></div>
<h2>Knocks (real / monster)</h2><div class="row" id="knocks"></div>
<h2>Voice</h2>
<div class="row">
  <input id="vtext" type="text" value="Hello, it's me. Can I come in? Please...">
  <label>pitch <input id="vp" type="range" min="0.6" max="1.8" step="0.05" value="1"></label>
  <label>speed <input id="vsp" type="range" min="0.7" max="1.4" step="0.05" value="1"></label>
  <select id="vw"><option>triangle</option><option>sine</option><option>square</option><option>sawtooth</option></select>
  <label><input id="vmon" type="checkbox"> monster</label>
  <label><input id="vdis" type="checkbox"> distort</label>
  <button id="say">speak</button>
</div>
<h2>SFX</h2><div class="row" id="sfx"></div>
<h2>Heartbeat and loops</h2>
<div class="row">
  <label>heartbeat <input id="hb" type="range" min="0" max="1" step="0.05" value="0"></label>
  <span id="loops"></span>
</div>
<h2>Captions</h2><div id="log"></div>
<h2>Self-test result</h2><div id="result">(not run)</div>

<script type="module">
import { audio, createAudioEngine } from '../js/systems/audio.js';
import { bus } from '../js/core/bus.js';
import { store } from '../js/core/state.js';

const $ = (id) => document.getElementById(id);
const logEl = $('log');
const captionsSeen = [];
bus.on('caption', (t) => { captionsSeen.push(t); logEl.textContent += t + '\n'; logEl.scrollTop = logEl.scrollHeight; });

const SFX = ['peepholeOpen','peepholeClose','bolt','doorOpen','doorSlam','footstepsIn','footstepsAway','flashlightOn','flashlightOff','mirror','candle','pageTurn','penScratch','hammer','flameOut','reveal','jumpscare1','jumpscare2','jumpscare3','powerOut','uiClick','uiHover','chime','bell','creak','gulp'];
const STYLES = ['soft','hard','scratch','beep','roll','thud','stumble','slow'];
const PATTERNS = { soft: [[0,260],[0,260,700]], hard: [[0,300,600,900],[0,300,600,900,1300]], scratch: [[0,400],[0,400,800]], beep: [[0,200,400],[0,200,400,650]],
  roll: [[0,60,120,180,240,300,360,420],[0,60,120,180,240,300,360,420,600]], thud: [[0,700],[0,700,1500]], stumble: [[0,350],[0,350,700]], slow: [[0,900,1800],[0,900,1800]] };
const mock = (style, extra = {}) => ({ id: 'mock', name: 'Mock', knock: { style, real: PATTERNS[style][0], monster: PATTERNS[style][1] }, voice: { pitch: 1, speed: 1, wave: 'triangle' }, ...extra });

const btn = (parent, label, fn, cls = '') => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = () => fn(b); $(parent).append(b); return b; };
for (const m of ['menu','day','night','finale','off']) btn('music', m, () => audio.music(m));
for (const m of ['night','day','off']) btn('ambient', m, () => audio.ambient(m));
for (const s of STYLES) { btn('knocks', s + ' real', () => audio.knock(mock(s), 'real')); btn('knocks', s + ' monster', () => audio.knock(mock(s), 'monster')); }
for (const n of SFX) btn('sfx', n, () => audio.sfx(n));
for (const l of ['ticking','static','whisper']) { let on = false; btn('loops', l, (b) => { on = !on; b.classList.toggle('on', on); audio.loop(l, on); }); }
$('init').onclick = async () => { await audio.init(); $('state').textContent = 'audio.ready = ' + audio.ready; };
$('stop').onclick = () => audio.stopAll();
const vols = () => audio.setVolumes({ master: +$('vm').value, music: +$('vmu').value, sfx: +$('vs').value });
for (const id of ['vm','vmu','vs']) $(id).oninput = vols;
$('reduce').onchange = () => { store.settings.reduceScares = $('reduce').checked; };
$('hb').oninput = () => audio.heartbeat(+$('hb').value);
$('say').onclick = () => audio.voice({ id: 'mock', voice: { pitch: +$('vp').value, speed: +$('vsp').value, wave: $('vw').value } }, $('vtext').value, { monster: $('vmon').checked, distort: $('vdis').checked });

// ------------------------------------------------------------------------------------------
// self-test
// ------------------------------------------------------------------------------------------
const errors = [];
window.addEventListener('error', (e) => errors.push('window error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => errors.push('unhandled rejection: ' + e.reason));
const origErr = console.error;
console.error = (...a) => { errors.push('console.error: ' + a.join(' ')); origErr(...a); };

function callAll(a) {
  const out = [];
  const tryCall = (name, fn) => { try { const r = fn(); out.push({ name, thenable: !!(r && typeof r.then === 'function') }); } catch (e) { out.push({ name, threw: String(e) }); } };
  tryCall('setVolumes', () => a.setVolumes({ master: 0.8, music: 0.6, sfx: 0.9 }));
  for (const m of ['menu','day','night','finale','off']) tryCall('music:' + m, () => a.music(m));
  for (const m of ['night','day','off']) tryCall('ambient:' + m, () => a.ambient(m));
  for (const s of STYLES) for (const v of ['real','monster']) tryCall(`knock:${s}:${v}`, () => a.knock(mock(s), v));
  for (const v of [{}, { monster: true }, { distort: true }, { monster: true, distort: true }]) tryCall('voice:' + JSON.stringify(v), () => a.voice(mock('soft'), "Hi there, it's me! Is anybody home?", v));
  tryCall('voice:empty', () => a.voice(mock('soft'), '', {}));
  tryCall('voice:nofigure', () => a.voice(null, 'hello', {}));
  tryCall('knock:nofigure', () => a.knock(null, 'real'));
  for (const n of SFX) tryCall('sfx:' + n, () => a.sfx(n));
  tryCall('sfx:unknown', () => a.sfx('doesNotExist'));
  for (const l of [0.2, 0.7, 1, 0]) tryCall('heartbeat:' + l, () => a.heartbeat(l));
  for (const l of ['ticking','static','whisper']) { tryCall('loop:' + l + ':on', () => a.loop(l, true)); }
  for (const l of ['ticking','static','whisper']) { tryCall('loop:' + l + ':off', () => a.loop(l, false)); }
  tryCall('stopAll', () => a.stopAll());
  return out;
}

function measure(buf) {
  let peak = 0, sum = 0, n = 0, nan = 0, firstLoud = -1;
  for (let ch = 0; ch < buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < d.length; i++) {
      const v = d[i];
      if (v !== v || !Number.isFinite(v)) { nan++; continue; }
      const av = Math.abs(v);
      if (av > peak) peak = av;
      sum += v * v; n++;
      if (firstLoud < 0 && av > 0.01) firstLoud = i;
    }
  }
  return { peak: +peak.toFixed(3), rms: +Math.sqrt(sum / (n || 1)).toFixed(4), nan, startMs: firstLoud < 0 ? -1 : Math.round(firstLoud / buf.sampleRate * 1000) };
}

async function offlineRender(label, seconds, setup, { vols = { master: 1, music: 1, sfx: 1 }, reduce = false } = {}) {
  const rate = 44100;
  const ctx = new OfflineAudioContext(2, Math.ceil(rate * seconds), rate);
  const eng = createAudioEngine(ctx, { offline: true, volumes: vols });
  store.settings.reduceScares = reduce;
  setup(eng);
  eng.pumpTo(seconds);
  const buf = await ctx.startRendering();
  store.settings.reduceScares = $('reduce').checked;
  return { label, seconds, ...measure(buf) };
}

async function runSelfTest() {
  $('result').textContent = 'running...';
  const res = { errors, pre: window.__preInit };
  // after init, realtime
  await audio.init();
  $('state').textContent = 'audio.ready = ' + audio.ready;
  res.ready = audio.ready;
  res.post = callAll(audio);
  await new Promise((r) => setTimeout(r, 600));
  // keep things alive for a moment, then stop
  audio.music('night'); audio.ambient('day'); audio.heartbeat(0.5); audio.loop('whisper', true);
  await new Promise((r) => setTimeout(r, 1500));
  await audio.stopAll();
  res.postBad = res.post.filter((r) => r.threw || !r.thenable);
  res.preBad = (res.pre || []).filter((r) => r.threw || !r.thenable);

  // offline measurements
  const rows = [];
  for (const n of SFX) rows.push(await offlineRender('sfx:' + n, 3.5, (e) => e.sfx(n)));
  for (const s of STYLES) for (const v of ['real','monster']) rows.push(await offlineRender(`knock:${s}:${v}`, 4, (e) => e.knock(mock(s), v)));
  for (const [lab, o] of [['plain', {}], ['monster', { monster: true }], ['distort', { distort: true }], ['monster+distort', { monster: true, distort: true }]]) {
    for (const w of ['triangle', 'square', 'sawtooth']) {
      rows.push(await offlineRender(`voice:${lab}:${w}`, 6, (e) => e.voice({ id: 'v', voice: { pitch: 1, speed: 1, wave: w } }, "Hello, it's me. Can I come in? Please let me in, it is cold out here.", o)));
    }
  }
  for (const m of ['menu', 'day', 'night']) rows.push(await offlineRender('music:' + m, 32, (e) => e.music(m)));
  rows.push(await offlineRender('music:finale', 45, (e) => e.music('finale')));
  for (const m of ['night', 'day']) rows.push(await offlineRender('ambient:' + m, 14, (e) => e.ambient(m)));
  for (const l of [0.2, 1]) rows.push(await offlineRender('heartbeat:' + l, 6, (e) => e.heartbeat(l)));
  for (const l of ['ticking', 'static', 'whisper']) rows.push(await offlineRender('loop:' + l, 6, (e) => e.loop(l, true)));
  // worst case: everything at once at full volume
  rows.push(await offlineRender('MIX all at once', 8, (e) => {
    e.music('night'); e.ambient('night'); e.heartbeat(1); e.loop('static', true); e.loop('whisper', true); e.loop('ticking', true);
    e.sfx('jumpscare2'); e.knock(mock('hard'), 'monster'); e.voice(mock('soft'), 'Let me in, let me in!', { monster: true });
    e.sfx('hammer'); e.sfx('doorSlam');
  }));
  // reduce scares comparison
  const js = [];
  for (const n of ['jumpscare1', 'jumpscare2', 'jumpscare3', 'reveal']) {
    const a = await offlineRender(n + ' normal', 3, (e) => e.sfx(n));
    const b = await offlineRender(n + ' reduced', 3, (e) => e.sfx(n), { reduce: true });
    js.push({ n, normal: a.peak, reduced: b.peak, rmsNormal: a.rms, rmsReduced: b.rms });
  }
  res.reduceScares = js;
  res.rows = rows;
  res.problems = rows.filter((r) => r.nan > 0 || r.rms < 0.0003 || r.peak >= 1 || r.peak < 0.01).map((r) => r.label + ' ' + JSON.stringify(r));
  res.captions = [...new Set(captionsSeen)];
  window.__audioTest = res;
  $('result').textContent = JSON.stringify(res, null, 1);
  return res;
}
window.runAudioSelfTest = runSelfTest;
$('selftest').onclick = runSelfTest;

// before init: every method must be a safe no-op returning a promise
window.__preInit = callAll(audio);
window.__preReady = audio.ready;
window.__testReady = true;
</script>
</body>
</html>
